name: CI

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Siapkan environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan test
        run: php artisan test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

  deploy:
    name: Deploy (build & push image ke ghcr.io)
    # Hanya push ke main, dan hanya jika kedua job di atas lulus.
    # Pull Request, branch dev, dan branch fitur berhenti sebelum job ini (status: skipped).
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Nilai rahasia hanya ada di GitHub Secrets: tidak ditulis di repository,
      # tidak dicetak ke log, dan tidak dimasukkan ke image.
      # Saat container dijalankan, nilainya diberikan lewat environment (lihat docker-compose.yml).
      - name: Pastikan secrets sudah diisi
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$APP_KEY" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::error::Secret APP_KEY dan/atau DB_PASSWORD belum dibuat di Settings > Secrets and variables > Actions."
            exit 1
          fi
          case "$APP_KEY" in
            base64:*) ;;
            *) echo "::error::APP_KEY harus berformat base64:... (hasil php artisan key:generate --show)."; exit 1 ;;
          esac
          echo "Secrets tersedia."

      # ghcr.io mewajibkan nama image huruf kecil semua
      - name: Siapkan nama image
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dan push image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          provenance: false
          tags: ghcr.io/${{ env.OWNER }}/inventori-gudang-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build dan push image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          provenance: false
          tags: ghcr.io/${{ env.OWNER }}/inventori-gudang-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Ringkasan image
        run: |
          {
            echo "### Image terunggah ke ghcr.io"
            echo ""
            echo "- ghcr.io/${OWNER}/inventori-gudang-backend:${GITHUB_SHA}"
            echo "- ghcr.io/${OWNER}/inventori-gudang-frontend:${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
